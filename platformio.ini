; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-2432S032C

[env:esp32-2432S032C]
platform = espressif32
board = esp32-2432S032C
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
    -Ofast
    -Wall
    -D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    rzeldent/esp32_smartdisplay @ 2.1.1
    lvgl/lvgl @ 9.2.2

; desktop simulator -- run with `pio run -e native -t execute`
; requires SDL2 installed via `brew install sdl2`
[env:native]
platform = native@^1.1.3
extra_scripts =
    pre:native/sdl2_paths.py
    post:native/sdl2_build_extra.py
build_flags =
    -std=gnu++17
    -I src
    -I native/arduino_shim
    -D NATIVE_SIMULATOR
    ; skip src/include/lv_conf.h entirely -- configure LVGL via flags below instead,
    ; avoids re-fighting the same lv_conf.h include issues from the ESP32 build
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=32
    -D LV_FONT_MONTSERRAT_8=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_22=1
    -D LV_USE_SDL=1
    -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
    -lSDL2
lib_deps =
    lvgl/lvgl @ 9.2.2
build_src_filter =
    +<*>
    -<main.cpp>
    -<wifi_setup.cpp>
    -<oba_client.cpp>
    -<clock.cpp>
    -<weather_client.cpp>
    -<chime_tone.cpp>
    +<../native/main.cpp>
    +<../native/oba_client.cpp>
    +<../native/clock.cpp>
    +<../native/weather_client.cpp>
    +<../native/chime_tone.cpp>
